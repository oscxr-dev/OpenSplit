server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the orchestrator (same docker network).
    # Frontend uses a relative base URL (/api/v1), so without this the
    # SPA fallback would return index.html for API requests.
    location /api/ {
        proxy_pass http://orchestrator:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
